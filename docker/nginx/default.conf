# Serves the Next.js static export (the `out/` directory).
#
# Every page is a real file (index.html, about.html, ...), so a path maps to
# the file, then `<path>.html`, then `<path>/index.html`. Anything else is the
# exported 404 page with a 404 status. Client-side navigation fetches the
# `.txt` payload next to each page, which the same rule serves.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    error_page 404 /404.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Next's hashed build output: the file name changes with the content.
    location /_next/static/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Brand images and the portfolio pictures: unhashed names, but they
    # change with a release, so a day in cache and then revalidate.
    location /CORESITY-IMAGE/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    location = /404.html {
        internal;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Pages and unhashed public files (icons, logos) are revalidated on each
    # request.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html $uri/index.html =404;
    }
}
